# Fork-only workflow: builds the self-building image (docker/Dockerfile.local)
# and pushes it to ghcr.io/argrithmag/cloudcmd on every push to master,
# so the OMV server only pulls — no compiling on the box.
#
# Uses only GITHUB_TOKEN — no Docker Hub secrets needed
# (upstream's docker.yml requires those and only runs on tags).
name: Docker GHCR
permissions:
  contents: read
on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  buildx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.local
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
